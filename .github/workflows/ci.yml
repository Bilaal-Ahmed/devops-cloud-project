name: DevOps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t devops-web:test .

      - name: Test container
        run: |
          docker run -d --name devops-test -p 8080:80 devops-web:test
          sleep 5
          curl --fail http://localhost:8080
          docker stop devops-test
          docker rm devops-test
  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd ${{ secrets.EC2_PROJECT_PATH }}

            echo "Pulling latest code..."
            git pull origin main

            echo "Building Docker image..."
            docker build -t devops-web:latest .

            echo "Stopping old container..."
            docker stop devops-web || true

            echo "Removing old container..."
            docker rm devops-web || true

            echo "Starting new container..."
            docker run -d \
              --name devops-web \
              --restart unless-stopped \
              -p 80:80 \
              devops-web:latest

            echo "Checking container..."
            docker ps

            echo "Testing application..."
            sleep 5
            curl --fail http://localhost

            echo "Deployment successful!"
